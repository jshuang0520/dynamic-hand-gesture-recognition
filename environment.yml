name: ml640_proj_env

channels:
  - conda-forge
  - pytorch
  - huggingface
  - defaults

dependencies:
# Use python 3.x 
  - python=3.10
  - pip
  
  # Core scientific computing
  - numpy>=1.21.0
  - pandas>=1.3.0
  - scipy>=1.7.0
  - matplotlib>=3.4.0
  - seaborn>=0.11.0
  - plotly>=5.0.0

  # Image processing
  - opencv 
  - pillow

  # Jupyter ecosystem
  - jupyter>=1.0.0
  - jupyterlab>=3.0.0
  - notebook>=6.4.0
  - ipywidgets>=7.6.0
  
  # Machine Learning
  - scikit-learn>=1.0.0
  - pytorch>=1.9.0
  - torchvision>=0.10.0
  - torchaudio>=0.9.0
  - tensorflow 
  - tensorboard

  # Utilities
  - tqdm>=4.62.0
  - pyyaml>=5.4.0
  - requests>=2.26.0
  
  # Development tools
  - black>=21.9.0
  - flake8>=3.9.0
  - pytest>=6.2.0
  
  # pip-only packages
  - pip:
    - transformers>=4.12.0
    - mediapipe
    - openpyxl>=3.0.8
    - networkx>=2.6.0
    - python-dotenv>=0.19.0
    - jupyter-contrib-nbextensions>=0.5.0