experiment:
  # Using today's date in Greenbelt as the seed for good luck
  seed: 20260501
  num_classes: 4
  target_classes: ["Stop Sign", "Swiping Left", "Sliding Two Fingers Down", "Thumb Up"]
  frames_per_video: 16
  batch_size: 2          # LOWERED: To accommodate the micro-dataset size
  learning_rate: 0.0001
  num_epochs: 3          # LOWERED: 3 epochs is enough to verify the loop doesn't crash
  execution_mode: "gpu"
  # --- NEW: Dynamic Tensor Sizing ---
  preprocess_size: 224    # Base resolution saved to disk (for Hybrid Model)
  model_input_size: 112   # Resolution interpolated on-the-fly (for 3D ResNet)
  # --- NEW: Robustness Hyperparameters ---
  dropout_rate: 0.5
  weight_decay: 0.0001
  early_stopping_patience: 5

# --- NEW: Normalization Statistics ---
preprocessing:
  normalize_mean: [0.485, 0.456, 0.406]  # ImageNet Standard
  normalize_std: [0.229, 0.224, 0.225]   # ImageNet Standard

# The Micro-Split Configuration
data_splits:
  train_per_class: 2     # 2 * 4 classes = 8 total train videos
  val_per_class: 1       # 1 * 4 classes = 4 total val videos
  test_per_class: 1      # 1 * 4 classes = 4 total test videos

paths:
  # The updated symmetric structure
  raw_data_dir: "${OUTPUT_ROOT}/${ENV}/raw_data"
  annotations_dir: "${OUTPUT_ROOT}/${ENV}/raw_data/annotations"
  videos_dir: "${OUTPUT_ROOT}/${ENV}/raw_data/videos"
  
  metadata_dir: "${OUTPUT_ROOT}/${ENV}/metadata"
  processed_dir: "${OUTPUT_ROOT}/${ENV}/metadata/data_processed"
  
  # Models and Logs
  weights_dir: "${OUTPUT_ROOT}/${ENV}/models"
  logs_dir: "${OUTPUT_ROOT}/${ENV}/logs"