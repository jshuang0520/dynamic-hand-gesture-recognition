experiment_name: "SHAN_14k_Subsample"

reproducibility:
  seed: 202605
  deterministic_cudnn: true

data:
  # RAW DATA (Read-Only)
  frames_dir: "${HOME}/jester_uncompressed/20bn-jester-v1/"
  
  # SHARED PIPELINE I/O
  keypoints_dir: "${HOME}/shan_project/data/keypoints_cache/"
  
  # CORRECTED SPLIT PATHS
  train_csv: "${HOME}/jester_uncompressed/jester_splits/train.csv"
  val_csv: "${HOME}/jester_uncompressed/jester_splits/val.csv"
  test_csv: "${HOME}/jester_uncompressed/jester_splits/test.csv"
  
  num_classes: 14
  frames_per_video: 16

extraction:
  num_workers: 8